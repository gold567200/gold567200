<title>Genius Protocol</title>

<style>
/* ============ GENIUS PROTOCOL — cyberpunk/hologram learning OS ============
   Layout: fixed HUD top bar + scrollable deck + fixed bottom nav rail.
   Committed dark "hologram" look; every color is an explicit token. */
:root{
  --bg:#060a14; --bg2:#0a1120; --panel:#0c1526cc; --panel-solid:#0b1322;
  --grid:#10233f; --line:#15385e;
  --fg:#d7f3ff; --dim:#7fa6c4; --faint:#6686a2;
  --cyan:#00e5ff; --cyan-d:#0097b3; --mag:#ff2bd6; --mag-d:#b31f97;
  --lime:#8bffb0; --amber:#ffd166; --red:#ff5d6c; --violet:#8a7dff;
  --ok:#36e0a0; --warn:#ffd166; --bad:#ff5d6c;
  --glow:0 0 12px; --r:14px; --rs:9px;
  --fdisp:'Orbitron',system-ui,sans-serif;
  --fbody:'Rajdhani',system-ui,sans-serif;
  --fmono:'Share Tech Mono',ui-monospace,monospace;
  --fread:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
    radial-gradient(1200px 600px at 80% -10%, #0c1c35 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #1a0a2e 0%, transparent 55%),
    var(--bg);
  color:var(--fg);font-family:var(--fbody);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden}
body::before{/* holo grid */
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(130% 100% at 50% 0%,#000 30%,transparent 78%);
          mask-image:radial-gradient(130% 100% at 50% 0%,#000 30%,transparent 78%)}
body::after{/* scanline sweep */
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,transparent 0 3px,#02060d33 3px 4px)}
@media (prefers-reduced-motion:no-preference){
  #hud .brand b{animation:flick 6s infinite}
  .lvlbar>i{transition:width .6s cubic-bezier(.2,.9,.2,1)}
  .holo{animation:rise .5s both}
}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.4}99%{opacity:.85}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

a{color:var(--cyan);text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--fdisp);font-weight:700;line-height:1.15;text-wrap:balance;letter-spacing:.02em}
code,.mono{font-family:var(--fmono)}
::selection{background:var(--mag);color:#0a0a0a}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#163a5e;border-radius:10px}

/* Accessibility: keyboard skip link, visible focus, reduced motion. */
.skip-link{position:fixed;z-index:100;left:12px;top:8px;transform:translateY(-180%);padding:10px 14px;border-radius:8px;background:var(--fg);color:var(--bg);font-weight:700}
.skip-link:focus-visible{transform:translateY(0);outline:3px solid var(--cyan);outline-offset:3px;box-shadow:0 0 0 3px var(--cyan)}
#hud .brand:focus-visible{outline:3px solid var(--cyan);outline-offset:5px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---- shell ---- */
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#07101fee,#07101f99);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
body::before{}
#hud .brand{appearance:none;background:transparent;border:0;padding:0;text-align:left;font-family:var(--fdisp);font-weight:800;letter-spacing:.14em;font-size:15px;
  color:var(--cyan);text-shadow:var(--glow) #00e5ff66;white-space:nowrap;cursor:pointer}
#hud .brand b{color:var(--mag);text-shadow:var(--glow) #ff2bd666}
#hud .spacer{flex:1}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1;gap:3px;min-width:0}
.stat .k{font-family:var(--fmono);font-size:10px;letter-spacing:.15em;color:var(--faint)}
.stat .v{font-family:var(--fdisp);font-size:15px;color:var(--fg)}
.stat .v.cy{color:var(--cyan)} .stat .v.mg{color:var(--mag)} .stat .v.am{color:var(--amber)}
.lvlbar{width:92px;height:6px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0a1626}
.lvlbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--mag))}

#deck{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
#deck .wrap{max-width:860px;margin:0 auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}

#nav{flex:0 0 auto;display:flex;gap:4px;justify-content:space-around;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(0deg,#07101fee,#07101f99);backdrop-filter:blur(8px);
  border-top:1px solid var(--line)}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 10px;border-radius:10px;color:var(--faint);font-family:var(--fmono);font-size:10px;letter-spacing:.08em}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
#nav button.on{color:var(--cyan);text-shadow:var(--glow) #00e5ff66}
#nav button.on svg{filter:drop-shadow(0 0 5px #00e5ff99)}

/* ---- primitives ---- */
.holo{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 #ffffff0d, 0 10px 30px -18px #000}
.holo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(var(--cyan),var(--mag));opacity:.8}
.holo.mg::before{background:linear-gradient(var(--mag),var(--violet))}
.holo.am::before{background:linear-gradient(var(--amber),var(--mag))}
.grid{display:grid;gap:14px}
@media(min-width:620px){.grid.c2{grid-template-columns:1fr 1fr}}
.eyebrow{font-family:var(--fmono);font-size:11px;letter-spacing:.22em;color:var(--mag);text-transform:uppercase;margin:0 0 6px}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--fmono);font-size:11px;letter-spacing:.06em;
  padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--dim);background:#0a16268c}
.chip.cy{color:var(--cyan);border-color:#0e4a63} .chip.mg{color:var(--mag);border-color:#5a1f52}
.chip.ok{color:var(--ok);border-color:#15503c} .chip.am{color:var(--amber);border-color:#5a4a1f}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--cyan-d);background:#03212b;
  color:var(--cyan);font-family:var(--fdisp);font-weight:600;font-size:13px;letter-spacing:.06em;
  padding:10px 16px;border-radius:10px;transition:.15s;text-shadow:var(--glow) #00e5ff44}
.btn:hover{background:#06323f;box-shadow:var(--glow) #00e5ff55}
.btn.mg{border-color:var(--mag-d);background:#2a0725;color:var(--mag);text-shadow:var(--glow) #ff2bd644}
.btn.mg:hover{box-shadow:var(--glow) #ff2bd655}
.btn.ghost{background:none;border-color:var(--line);color:var(--dim);text-shadow:none}
.btn.ghost:hover{color:var(--fg);border-color:var(--cyan-d)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--fmono);font-size:10px;letter-spacing:.14em;color:var(--faint)}
hr{border:0;border-top:1px dashed var(--line);margin:18px 0}

/* lecture body — tuned for long reading: a clean text face, bigger type, generous leading, short lines */
:root{--read:18px}
.lecture{font-family:var(--fread);font-size:var(--read);line-height:1.75;letter-spacing:.005em;max-width:68ch;color:#e6f6ff}
.lecture h4{font-family:var(--fdisp);color:var(--cyan);font-size:15px;letter-spacing:.04em;margin:28px 0 8px;text-shadow:var(--glow) #00e5ff33}
.lecture p{margin:0 0 14px}
.lecture ul,.lecture ol{margin:0 0 14px;padding-left:24px}
.lecture li{margin:6px 0}
.lecture strong{color:#fff}
.simplebox p{font-family:var(--fread);font-size:calc(var(--read) - 1px);line-height:1.7;margin:0 0 10px}
.simplebox p.pic{color:var(--amber)} .simplebox p.why{color:var(--lime)}
.simplebox b{color:#fff}
figure.fig{margin:14px 0 20px;padding:0}
figure.fig .figwrap{background:#070f1c;border:1px solid var(--line);border-radius:10px;padding:14px 10px;color:#cfeaf7}
figure.fig figcaption{font-family:var(--fread);font-size:14px;line-height:1.55;color:var(--dim);margin:8px 4px 0}
figure.fig figcaption b{color:var(--cyan)}
.lecture code{background:#0a1a2c;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--lime);font-size:14px}
.lecture pre{background:#070f1c;border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:8px;
  padding:14px;overflow-x:auto;margin:14px 0}
.lecture pre code{background:none;border:0;padding:0;color:var(--lime);font-size:13.5px;line-height:1.55}
.lecture :not(pre)>code,.simplebox code,.why code{overflow-wrap:anywhere;word-break:break-word}
.lecture table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14.5px;display:block;overflow-x:auto}
.lecture th,.lecture td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.lecture th{background:#0c1c31;color:var(--cyan);font-family:var(--fmono);font-size:12px;letter-spacing:.06em}
.lecture sup{font-size:.7em}

/* list rows */
.ilist{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--rs);background:#0a1424aa;transition:.15s}
.item:hover{border-color:var(--cyan-d);background:#0c1a2e}
.item .ix{font-family:var(--fdisp);font-size:18px;color:var(--faint);min-width:26px}
.item .bd{flex:1;min-width:0}
.item .ti{font-weight:600;font-size:16px}
.item .me{font-size:13.5px;color:var(--dim);margin-top:2px}
.done .ix{color:var(--ok);text-shadow:var(--glow) #36e0a055}

/* quiz */
.q{margin:0 0 14px}
.q .stem{font-size:16px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#0a1626;
  border-radius:9px;padding:11px 14px;margin:7px 0;transition:.12s;font-size:15.5px}
.opt:hover{border-color:var(--cyan-d)}
.opt.sel{border-color:var(--cyan);background:#06303d}
.opt.right{border-color:var(--ok);background:#07281f;color:#b6ffd9}
.opt.wrong{border-color:var(--bad);background:#2a0d12;color:#ffc2c8}
.opt.right::before{content:'✓ Correct — ';font-weight:700}
.opt.wrong::before{content:'✗ Your answer — ';font-weight:700}
.why{font-size:14px;color:var(--dim);border-left:2px solid var(--mag);padding:6px 0 6px 12px;margin:8px 0 0}
.sa textarea{width:100%;min-height:90px;background:#0a1626;border:1px solid var(--line);border-radius:9px;
  color:var(--fg);font-family:var(--fbody);font-size:15px;padding:11px;resize:vertical}

/* flashcard */
.card3d{perspective:1200px}
.card-in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.card-in.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:var(--r);
  padding:26px;display:flex;flex-direction:column;justify-content:center;background:var(--panel-solid)}
.face.back{transform:rotateY(180deg);border-color:var(--mag-d)}
.face .lab{font-family:var(--fmono);font-size:11px;letter-spacing:.2em;color:var(--faint);margin-bottom:10px}
.face .ct{font-size:20px;line-height:1.4}
.face.back .ct{font-size:17px;color:var(--lime);font-family:var(--fbody)}

/* progress bars */
.pbar{height:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0a1626}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));width:0;transition:width .5s}

/* tutor */
#tutor-view .feed{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.msg{max-width:88%;padding:11px 14px;border-radius:12px;font-size:15.5px;line-height:1.5;white-space:pre-wrap}
.msg.ada{align-self:flex-start;background:#0b1b2e;border:1px solid var(--cyan-d);border-bottom-left-radius:3px}
.msg.me{align-self:flex-end;background:#241029;border:1px solid var(--mag-d);border-bottom-right-radius:3px}
.msg .nm{font-family:var(--fmono);font-size:10px;letter-spacing:.14em;color:var(--faint);margin-bottom:5px}
.ask{display:flex;gap:8px;position:sticky;bottom:0;background:linear-gradient(0deg,#060a14,#060a14cc 70%,transparent);padding-top:10px}
.ask input{flex:1;background:#0a1626;border:1px solid var(--line);border-radius:10px;color:var(--fg);
  font-family:var(--fbody);font-size:15.5px;padding:12px 14px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-right:4px;animation:pulse 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

/* ADA pop-in */
#popin{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  z-index:40;max-width:320px;background:#0b1b2e;border:1px solid var(--cyan-d);border-radius:14px;padding:14px 16px 14px 46px;
  box-shadow:0 10px 40px -10px #000,var(--glow) #00e5ff22;display:none}
#popin.show{display:block;animation:rise .4s both}
#popin .av{position:absolute;left:12px;top:14px;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#00e5ff,#1b2a5b);box-shadow:var(--glow) #00e5ff88}
#popin .nm{font-family:var(--fmono);font-size:10px;letter-spacing:.14em;color:var(--cyan);margin-bottom:4px}
#popin .tx{font-size:14.5px;line-height:1.45}
#popin .x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--faint);font-size:18px}
#popin .row{margin-top:10px}

/* interactive sims */
.sim{display:flex;flex-direction:column;gap:14px}
.toggles{display:flex;gap:10px;flex-wrap:wrap}
.tog{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--fmono);font-size:12px;color:var(--dim)}
.tog button{width:54px;height:54px;border-radius:12px;border:1px solid var(--line);background:#0a1626;
  font-family:var(--fdisp);font-size:20px;color:var(--faint)}
.tog button.on{border-color:var(--cyan);color:var(--cyan);background:#06303d;box-shadow:var(--glow) #00e5ff55;text-shadow:var(--glow) #00e5ff}
.lamp{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--fdisp);font-size:18px;color:var(--faint);background:#0a1626}
.lamp.on{border-color:var(--lime);color:#071;background:radial-gradient(circle,#8bffb0,#1a7a4a);box-shadow:var(--glow) #8bffb0aa;color:#042}
.gaterow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.gaterow .gn{font-family:var(--fdisp);min-width:74px;color:var(--cyan)}
.bitbox{display:flex;gap:6px;flex-wrap:wrap}
.bit{width:40px;height:52px;border:1px solid var(--line);border-radius:8px;background:#0a1626;font-family:var(--fmono);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint)}
.bit b{font-family:var(--fdisp);font-size:20px;color:var(--faint)}
.bit.on{border-color:var(--cyan);background:#06303d} .bit.on b{color:var(--cyan);text-shadow:var(--glow) #00e5ff}
.bit small{font-size:9px}
.readout{font-family:var(--fmono);font-size:15px;color:var(--lime);background:#070f1c;border:1px solid var(--line);
  border-radius:8px;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.term{background:#030810;border:1px solid var(--line);border-radius:10px;font-family:var(--fmono);font-size:13.5px;
  color:#9fe6c4;height:340px;display:flex;flex-direction:column;overflow:hidden}
.term .out{flex:1;overflow-y:auto;padding:12px;white-space:pre-wrap;line-height:1.45}
.term .in{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 12px}
.term .in span{color:var(--cyan)}
.term .in input{flex:1;background:none;border:0;color:#cfeee0;font-family:var(--fmono);font-size:13.5px}
.perm-grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px;align-items:center}
.perm-grid .hd{font-family:var(--fmono);font-size:11px;color:var(--faint);text-align:center}
.perm-grid .rl{font-family:var(--fdisp);color:var(--mag);font-size:13px}
.pbtn{border:1px solid var(--line);background:#0a1626;border-radius:8px;padding:9px 0;font-family:var(--fmono);color:var(--faint)}
.pbtn.on{border-color:var(--cyan);color:var(--cyan);background:#06303d}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:#0a1626;border:0;padding:8px 13px;font-family:var(--fmono);font-size:12px;color:var(--dim)}
.seg button.on{background:#06303d;color:var(--cyan)}
input.txt{background:#0a1626;border:1px solid var(--line);border-radius:9px;color:var(--fg);font-family:var(--fmono);font-size:15px;padding:10px 12px}

.center{text-align:center}
.big{font-family:var(--fdisp);font-size:clamp(26px,7vw,40px);line-height:1.05}
.titlebar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.phasedot{width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:var(--glow) #00e5ff;flex:0 0 auto}
.lock{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:60;
  background:#07281f;border:1px solid var(--ok);color:#b6ffd9;font-family:var(--fmono);font-size:13px;
  padding:10px 16px;border-radius:10px;box-shadow:var(--glow) #36e0a044;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
details.sol{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#0a1626}
details.sol summary{cursor:pointer;padding:10px 12px;font-family:var(--fmono);font-size:13px;color:var(--amber);list-style:none}
details.sol summary::-webkit-details-marker{display:none}
details.sol summary::before{content:"▸ ";color:var(--mag)}
details.sol[open] summary::before{content:"▾ "}
details.sol .ans{padding:0 12px 12px;color:var(--lime);font-size:14.5px}

    {id:"p8",num:8,title:"Ethical Hacking & Penetration Testing",short:"Pentest",tagline:"Breaking in, legally and on contract, to make systems stronger.",
     prereq:"Domains 2, 3 and 7 are required. This domain is useless — and dangerous — without them.",
     outcomes:["State the law and ethics that separate a pentester from a criminal, and work only inside written scope.","Run the five phases of an engagement: recon, scanning, exploitation, post-exploitation, reporting.","Use the standard methodologies (PTES, OWASP Testing Guide, MITRE ATT&CK) as a professional framework.","Practice safely and legally in sanctioned labs.","Write a clear, actionable penetration-test report — the real deliverable.","Prepare for PenTest+, eJPT, CEH and OSCP."],
     modules:[{
        id:"p8m1",title:"Ethics, Law and the Rules of Engagement",minutes:35,
        outcomes:["State the one rule that defines ethical hacking.","Name the laws and documents that authorize your work.","Explain scope, rules of engagement and responsible disclosure.","Recognize when to stop and escalate."],
        body:`<p>The only thing separating a penetration tester from a criminal is <strong>authorization</strong>. The exact same action — scanning a network, exploiting a flaw — is a professional service when you have signed, written permission and a felony when you do not. This module comes first because every later skill is built on it, and no employer or certification will touch you without it.</p>
<h4>The one rule</h4>
<p>Never touch a system you do not own unless you hold explicit, written permission from someone with the authority to grant it, and you stay strictly inside the agreed scope. Not implied permission. Not "the client seemed fine with it." A signed document that names the targets, the dates, the methods allowed and the methods forbidden.</p>
<h4>The law (United States, in brief — and it is not legal advice)</h4>
<p>The Computer Fraud and Abuse Act (CFAA) makes unauthorized access to a computer a federal crime. Many states have their own versions. The point for you: authorization is the entire defense. There is no "I was just curious," no "I didn't change anything," no "it was already insecure." Testing a friend's site, your old employer's server, or a company you admire — without a contract — is a crime even with good intentions. Bug-bounty programs are written authorization within their published scope; read that scope like a contract, because it is one.</p>
<h4>The documents that make you legitimate</h4>
<ul>
<li><strong>Scope</strong>: exactly which IPs, domains, applications and accounts are in-bounds, and which are explicitly out.</li>
<li><strong>Rules of Engagement (RoE)</strong>: allowed techniques, test windows (often off-hours), rate limits, whether social engineering or denial-of-service is permitted (usually not), and a named emergency contact.</li>
<li><strong>Authorization letter ("get out of jail" letter)</strong>: signed by someone who owns the systems, carried for the duration of the test.</li>
<li><strong>NDA</strong>: you will see secrets; you are legally bound to protect them.</li>
</ul>
<h4>Responsible disclosure</h4>
<p>When you find a flaw — in an engagement or a bug-bounty — you report it privately to the owner and give them reasonable time to fix it before any public mention. You never sell it, never post it, never use it beyond what proves the point. Coordinated disclosure is the norm the whole industry runs on.</p>
<h4>When to stop</h4>
<p>If you find evidence of a real, ongoing breach by someone else; if you stumble onto data outside scope (medical records, a different company's systems); if an exploit could crash a production system people depend on — you stop, document, and escalate to your named contact immediately. A professional's judgment about when not to proceed is worth more than any exploit.</p>
<h4>Where you practice</h4>
<p>You never practice on the live internet. You practice in environments built and licensed for it: platforms like TryHackMe and Hack The Box, PortSwigger's free Web Security Academy, deliberately vulnerable apps like OWASP Juice Shop and DVWA that you run in a VM you own, and VulnHub images. Every hands-on lab in this domain points you there. Build a home lab of VMs on your own machine and you can attack it to your heart's content, legally.</p>`,
        example:`<p><strong>The career case for ethics.</strong> Employers run background checks and ask behavioral questions about exactly this. The pentesters with the best reputations are the ones clients trust in their most sensitive systems — trust built on never crossing the line. Your clean record and your judgment are your most valuable assets, worth more than any single technique.</p>`,
        misconceptions:["\"If a system is insecure, testing it is fair game.\" Authorization, not the target's weakness, is what makes testing legal.","\"I didn't cause damage, so it's fine.\" The CFAA criminalizes unauthorized access itself, damage or not.","\"Bug bounties mean anything goes.\" Only what the published scope allows; everything else is unauthorized."],
        problems:[
          {q:"A recruiter says 'prove your skills — break into our site and show us.' What do you do?",a:"Get it in writing with scope and an authorization signature first, or decline. A verbal dare is not authorization; a real company will provide a scoped engagement."},
          {q:"During a test you find customer records belonging to a different company on a shared server. Next step?",a:"Stop, do not access further, document what you saw and how, and escalate to your named contact immediately — it is out of scope and possibly a separate breach."},
          {q:"Why is denial-of-service usually forbidden in the rules of engagement?",a:"It can take down production systems real people depend on; the goal is to find weaknesses, not cause outages. It is allowed only if explicitly contracted."}
        ],
        checks:[{q:"What single thing makes hacking ethical and legal?",a:"Explicit written authorization within an agreed scope."},{q:"What is the RoE?",a:"Rules of Engagement: the agreed techniques, timing and limits of the test."},{q:"Where do you practice, never?",a:"In sanctioned labs and your own VMs — never on systems you don't own."}],
        explain:"Explain to ADA, in your own words, why you would turn down a paid job to 'just quietly check if a competitor's site is hackable.' Have ADA push back as a tempting client."
     }], labs:[
       {id:"p8lab1",title:"Build a home pentest lab",goal:"Stand up a legal practice range on your own machine.",steps:["Install VirtualBox; create an attacker VM (Kali Linux) and a target VM (OWASP Juice Shop or Metasploitable) on a host-only network so nothing leaks to the real internet.","Confirm the two VMs can reach each other and nothing else.","Document the network so you can prove isolation."],deliverable:"A diagram of your isolated lab network."},
       {id:"p8lab2",title:"PortSwigger Web Security Academy",goal:"Learn web vulnerabilities in the vendor's own free, legal labs.",steps:["Create a free account at the Web Security Academy.","Complete the 'SQL injection' and 'Access control' learning paths — all in their sandbox.","Summarize each vulnerability class for ADA: what it is, how it's found, how it's fixed."],deliverable:"Your written summaries."},
       {id:"p8lab3",title:"Capture the flag",goal:"Apply the five-phase method on a sanctioned box.",steps:["On TryHackMe, complete a beginner room end to end.","Keep notes in the recon → scan → exploit → post-exploit → report structure.","Write a one-page report as if for a client."],deliverable:"Your CTF report."}

    {id:"p11",num:11,title:"Reverse Engineering & Malware Analysis",short:"RevEng",tagline:"Understanding compiled software without its source — for defense, research and CTFs, never piracy.",
     prereq:"Domains 3 (Linux), 4 (coding), 7 (security) and 8 (ethics). You analyze only software you may lawfully analyze.",
     outcomes:["Explain what reverse engineering is and its legitimate professional uses: malware analysis, vulnerability research, interoperability, forensics and CTFs.","Know the legal and ethical lines — the DMCA, EULA anti-RE clauses, and why you practice only on your own binaries, open source, CTF challenges and authorized samples.","Read the shape of x86-64 and ARM assembly and explain the stack, registers and calling conventions at a conceptual level.","Tell static analysis from dynamic analysis; recognize PE, ELF and Mach-O; use strings, symbols and control-flow graphs.","Use the professional toolset — Ghidra, radare2/rizin with Cutter, x64dbg, GDB — and know where AI assistants fit and where they don't.","Analyze malware safely inside isolated VMs (FLARE-VM, REMnux), never on your real machine."],
     modules:[{
       id:"p11m1",title:"What Reverse Engineering Is — and the Law That Bounds It",minutes:35,
       outcomes:["State what RE is and its legitimate uses.","Explain the legal lines you must stay inside.","Name the standard professional tools and what each is for.","Explain how to study malware without infecting yourself."],
       body:`<p>Reverse engineering is the disciplined study of a finished program &mdash; without its source code &mdash; to work out how it behaves: its logic, its data, its secrets. It is a core, respected branch of computer science and security. And like Domain 8, it is defined less by its techniques than by the <strong>authorization and purpose</strong> behind them.</p>
<h4>What it's legitimately for</h4>
<p>Real professionals reverse-engineer for defense and knowledge: <strong>malware analysis</strong> (take apart a threat to build detections and protect people), <strong>vulnerability research</strong> (find bugs and disclose them responsibly), <strong>firmware and IoT security</strong>, <strong>interoperability</strong> (make software talk to an undocumented format or protocol), <strong>digital forensics</strong>, and <strong>CTF competitions</strong> that train all of the above. These are the jobs the GREM and OSED certifications exist to prove.</p>
<h4>The lines you do not cross</h4>
<p>RE is lawful in many contexts but bounded. In the US, the DMCA's anti-circumvention rules (section 1201) restrict bypassing a product's technological protections, with periodic exemptions for good-faith security research and interoperability; many software licenses also contain anti-reverse-engineering clauses whose force varies by country. The practical rule for your whole career: <strong>analyze only what you may lawfully analyze</strong> &mdash; programs you wrote, open-source software, purpose-built crackme and CTF challenges, and malware samples you are authorized to study. Never reverse someone's software to defeat its licensing, strip its protections, or clone and resell it. That is the exact boundary that separates a security professional from a pirate, and it is why the viral "reverse anything and rebuild its features" tools are the wrong place to learn: their headline use case lives on the wrong side of this line.</p>
<h4>The professional toolbox</h4>
<ul>
<li><strong>Ghidra</strong> &mdash; the NSA's free, open-source suite with an excellent decompiler, and the best place to start; its official GhidraClass course is free.</li>
<li><strong>IDA Pro</strong> (paid, the long-time industry standard) and <strong>IDA Free</strong>; <strong>Binary Ninja</strong> (modern, scriptable, paid with a free tier).</li>
<li><strong>radare2 / rizin</strong> with the <strong>Cutter</strong> GUI &mdash; powerful free frameworks.</li>
<li><strong>x64dbg</strong> (free Windows debugger), <strong>GDB</strong> with pwndbg or GEF (free Linux debugger), and the triage trio <strong>file</strong>, <strong>strings</strong>, <strong>objdump</strong>.</li>
<li><strong>AI-assisted RE</strong> (ReVa, r2ai, REA) wraps these tools. Treat them as accelerators once you know the fundamentals, not as a substitute for them &mdash; and remember the legal line above applies no matter what drives the tool.</li>
</ul>
<h4>Static vs dynamic, and the formats</h4>
<p>Analysts work two ways: <strong>static analysis</strong> examines the file at rest (disassembly into assembly, decompilation into approximate C-like pseudocode, mapping functions and strings), and <strong>dynamic analysis</strong> watches it run under a debugger or sandbox. You will meet three executable formats &mdash; <strong>PE</strong> (Windows), <strong>ELF</strong> (Linux), and <strong>Mach-O</strong> (macOS) &mdash; and two assembly families, x86-64 and ARM. The early wins almost always come from strings, imported function names, and the control-flow graph.</p>
<h4>Studying malware without becoming a victim</h4>
<p>Live malware is handled like hazardous material. You never run a sample on your real machine or a network you care about. You use an <strong>isolated virtual machine</strong> with host-only or no networking, take a <strong>snapshot</strong> before you detonate anything and revert afterward, and turn off shared folders and clipboard. Two ready-made analyst environments exist for exactly this: <strong>FLARE-VM</strong> (a Windows toolkit) and <strong>REMnux</strong> (a Linux distribution). This containment discipline is the first thing a malware-analysis employer checks that you understand.</p>`,
       example:`<p><strong>Why fundamentals beat tools.</strong> Hand two people the same AI RE assistant and the same unknown binary. The one who knows assembly, calling conventions and what a control-flow graph means can tell when the tool's decompilation is wrong, steer it, and trust the result. The one who doesn't gets confident nonsense. The tool multiplies skill; it doesn't replace it. That's why this domain teaches Ghidra and assembly first and the AI layer last.</p>`,
       misconceptions:["\"Reverse engineering is illegal.\" It is a legitimate, in-demand discipline; what's restricted is circumventing protections or using it for piracy.","\"A decompiler gives me the original source.\" It produces an approximation &mdash; readable pseudocode, with names and structure lost; the real skill is reading it.","\"I can safely run malware if I'm careful.\" Only inside an isolated, snapshotted VM with no real network; never on your working machine."],
       problems:[
         {q:"You want to practice RE legally tonight. Name three sources of binaries you may lawfully analyze.",a:"Programs you compiled yourself; open-source software; purpose-built crackme/CTF challenges (crackmes.one, picoCTF). Not commercial software you're trying to unlock."},
         {q:"Where do you run a live malware sample, and what two precautions are non-negotiable?",a:"In an isolated VM (FLARE-VM/REMnux) with host-only or no networking and a pre-detonation snapshot to revert to; shared folders and clipboard off."},
         {q:"What's the difference between disassembly and decompilation?",a:"Disassembly converts machine code to assembly (faithful, low-level); decompilation reconstructs approximate higher-level pseudocode (easier to read, lossy)."}
       ],
       checks:[{q:"What single factor makes RE legal or not?",a:"Whether you're authorized to analyze that software and your purpose is lawful (research/defense/interop, not piracy or defeating protection)."},{q:"Best free tool to start with?",a:"Ghidra."},{q:"Where do you detonate malware?",a:"An isolated, snapshotted VM with no real network."}],
       explain:"Explain to ADA why a company would pay a reverse engineer to take apart malware, and where the legal line is between that job and cracking software. Have ADA probe your reasoning."
     }], labs:[
       {id:"p11lab1",title:"First crackme in Ghidra",goal:"Analyze a legal practice binary with the pro tool.",steps:["Install Ghidra (free) and work through the first GhidraClass beginner exercise.","Download one beginner binary from crackmes.one (binaries built for legal practice).","Use strings and the decompiler to understand what it checks; write up your findings as an analyst would.","Walk ADA through your control-flow reasoning."],deliverable:"Your written analysis of the crackme."},
       {id:"p11lab2",title:"picoCTF Reverse Engineering track",goal:"Build real skill in a sanctioned CTF.",steps:["Make a free picoCTF account.","Complete the beginner Reverse Engineering challenges.","Keep a notebook: tool used, what you found, how you confirmed it.","Summarize each challenge's lesson for ADA."],deliverable:"Your challenge notebook."},
       {id:"p11lab3",title:"Reverse your own program",goal:"See both sides of the compiler.",steps:["Write a small C program with a password check and compile it yourself (fully legal — it's yours).","Open the binary in Ghidra and find your own logic in the decompilation.","Explain to ADA how the source maps to what you see."],deliverable:"Source + a screenshot of it decompiled, with your notes."}
     ], cert:"c-re", capstone:null, exam:[], cards:[
       {id:"p11c1",front:"Reverse engineering",back:"Studying a compiled program without source to recover how it works; legitimate for malware analysis, vuln research, interop, forensics and CTFs."},
       {id:"p11c2",front:"The RE legal line",back:"Analyze only what you may lawfully analyze (own/open-source/CTF/authorized samples); never to defeat licensing/DRM or clone-and-sell. DMCA §1201 and EULAs apply."},
       {id:"p11c3",front:"Disassembly vs decompilation",back:"Disassembly → assembly (faithful, low-level). Decompilation → approximate C-like pseudocode (readable, lossy)."},
       {id:"p11c4",front:"Static vs dynamic analysis",back:"Static: examine the file at rest. Dynamic: watch it run under a debugger/sandbox. Analysts alternate between them."},
       {id:"p11c5",front:"Executable formats",back:"PE (Windows), ELF (Linux), Mach-O (macOS); two assembly families, x86-64 and ARM."},
       {id:"p11c6",front:"RE toolbox",back:"Ghidra (free, start here), IDA Pro (paid), radare2/rizin + Cutter, x64dbg, GDB+pwndbg/GEF, file/strings/objdump; AI assistants as accelerators."},
       {id:"p11c7",front:"Malware analysis safety",back:"Isolated VM, host-only/no network, snapshot before detonation, no shared folders/clipboard; FLARE-VM (Windows) and REMnux (Linux)."},
       {id:"p11c8",front:"RE certifications",back:"GREM (GIAC Reverse Engineering Malware) — the premier malware-RE cert; OSED (OffSec EXP-301) — Windows exploit dev + RE. (CRTP is AD red-teaming, not RE.)"}
     ]}

      if(r.length>15000000) throw new Error('stored progress exceeds the safe size limit');
      const parsed=JSON.parse(r);
      if(!parsed || Array.isArray(parsed) || typeof parsed!=='object' || !safeStateTree(parsed) || typeof parsed.xp!=='number' || !Number.isFinite(parsed.xp) || parsed.xp<0 || parsed.xp>1000000000 || (parsed.streak!=null && (!Number.isFinite(parsed.streak)||parsed.streak<0))) throw new Error('stored progress is malformed');

    }catch(e){
      // Keep the unreadable copy under a separate key before anything can save over it.
      let kept=false; try{ const raw=localStorage.getItem(KEY); if(raw){ localStorage.setItem(KEY+'_unreadable_'+dayKey(),raw); kept=true; } }catch(_){}
      storageWarning(kept?'Saved progress could not be read safely. A copy was kept in this browser (key '+KEY+'_unreadable_'+dayKey()+'); restore from a backup if you have one.':'Saved progress could not be read in this browser. Restore from a backup if you have one.');
      return d;}
  }

    try{const data=JSON.stringify(S);if(data.length>15000000)throw new Error('progress exceeds safe size limit');localStorage.setItem(KEY,data);}

  function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function addXP(n,msg){ S.xp+=n; S.xplog=S.xplog||{}; const dk=dayKey(); S.xplog[dk]=(S.xplog[dk]||0)+n; touchStreak(); save(); renderHUD(); if(msg) toast(msg+"  +"+n+" XP"); }

  function deriveTerms(phase, module){
    if(module.terms && module.terms.length) return module.terms;
    const text=(module.body||'').replace(/<[^>]+>/g,' ');
    const out=[], seen=new Set();
    const tryAdd=(cands,def)=>{ for(const cand of cands){ const k=cand.toLowerCase(); if(seen.has(k)) continue; const re=termRegex(cand); if(!re) continue;
        const m=re.exec(text); if(m){ out.push({term:cand, def, pos:m.index}); seen.add(k); return true; } } return false; };
    (phase.cards||[]).forEach(c=>tryAdd(termCandidates(c.front), c.back));
    GLOSSARY.forEach(([t,d,ph])=>{ if(ph && ph.indexOf(phase.id)<0) return; if(out.length<16) tryAdd([t],d); });
    out.sort((a,b)=>a.pos-b.pos);
    return out;
  }
  function wrapTerm(node,index,matchText,def){
    const after=node.splitText(index); after.nodeValue=after.nodeValue.slice(matchText.length);
    const span=document.createElement('span'); span.className='kw'; span.tabIndex=0; span.setAttribute('role','button'); span.setAttribute('aria-describedby','kwpop');
    span.setAttribute('data-def',def); span.setAttribute('title',def); span.textContent=matchText;
    node.parentNode.insertBefore(span, after);
  }
  function annotateTerms(container, terms){
    if(!container||!terms||!terms.length) return;
    const sorted=terms.slice().sort((a,b)=>b.term.length-a.term.length);
    for(const t of sorted){
      const re=termRegex(t.term); if(!re) continue;
      const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT);
      let node;
      while((node=walker.nextNode())){
        if(!node.parentElement || node.parentElement.closest('code,pre,h1,h2,h3,h4,a,.kw')) continue;
        const m=re.exec(node.nodeValue);
        if(m){ wrapTerm(node,m.index,m[0],t.def); break; }
      }
    }
  }

  function initKwPop(){
    const c=el('lecture'); if(!c) return;
    const show=(k)=>{ const pop=el('kwpop'); pop.innerHTML='<div class="t">KEY TERM</div><b style="color:var(--mag)">'+esc(k.textContent)+'</b> — '+esc(k.getAttribute('data-def'));
      pop.style.display='block'; pop.classList.add('show'); const r=k.getBoundingClientRect(); const pr=pop.getBoundingClientRect();
      let top=r.bottom+6; if(top+pr.height>window.innerHeight-8) top=Math.max(8,r.top-pr.height-6);
      let left=Math.min(r.left, window.innerWidth-pr.width-12); pop.style.top=top+'px'; pop.style.left=Math.max(12,left)+'px'; };
    c.addEventListener('click',e=>{ const k=e.target.closest('.kw'); if(k){ e.stopPropagation(); show(k); } });
    c.addEventListener('mouseover',e=>{ const k=e.target.closest('.kw'); if(k) show(k); });
    c.addEventListener('mouseout',e=>{ if(e.target.closest('.kw')) hideKw(); });

    c.addEventListener('focusin',e=>{ const k=e.target.closest('.kw'); if(k) show(k); });
    c.addEventListener('focusout',e=>{ if(e.target.closest('.kw')) hideKw(); });
  }

  function pick(i,j){
    if(!GP._exam||GP._exam.done) return; // answers are locked once the exam is graded
    const q=phase(GP._exam.pid).exam[i];
    GP._exam.picks[i]=j;
    document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(b=>{
      b.classList.remove('sel','right','wrong');

  }
  function retakeExam(pid){ examView(pid); try{ window.scrollTo(0,0); const d=document.getElementById('deck'); if(d) d.scrollTop=0; }catch(e){} }
  function saGrade(i,v){ if(!GP._exam||GP._exam.done) return; GP._exam.sa[i]=v; el("eg"+i).textContent=v?'counted ✓':'marked for review'; }
  function gradeExam(pid){
    if(!GP._exam||GP._exam.pid!==pid||GP._exam.done) return; // one grade per attempt; "Retake" starts a fresh attempt
    { const exq=phase(pid).exam; const open=exq.filter((q,i)=>q.type==="sa"?GP._exam.sa[i]==null:GP._exam.picks[i]==null).length;
      const sb=document.querySelector('button[onclick^="GP.gradeExam"]');
      if(open && !(GP._exam.armed>Date.now())){ GP._exam.armed=Date.now()+8000; if(sb) sb.textContent=open+' unanswered — tap again to submit anyway'; toast(open+' question'+(open===1?' is':'s are')+' unanswered'); return; } }
    GP._exam.done=true;
    document.querySelectorAll('#examform button, #examform textarea').forEach(b=>{ b.disabled=true; });
    document.querySelectorAll('button[onclick^="GP.gradeExam"]').forEach(b=>{ b.disabled=true; b.textContent='Exam graded'; });
    const p=phase(pid), ex=p.exam; let correct=0,tot=ex.length; const results=[];
    ex.forEach((q,i)=>{
      if(q.type==="sa"){ if(GP._exam.sa[i]===1) correct++; results.push({q,right:GP._exam.sa[i]===1}); }
      else{
        const pk=GP._exam.picks[i];
        document.querySelectorAll(`.opt[data-q="${i}"]`).forEach(b=>{const jj=+b.dataset.j;
          if(jj===q.answer)b.classList.add('right'); if(jj===pk&&pk!==q.answer)b.classList.add('wrong');});
        const w=el("ew"+i); if(w){w.hidden=false;w.textContent=q.why||'';}
        results.push({q,right:pk===q.answer});
        if(pk===q.answer) correct++; else if(pk!=null) logMiss({id:q.id,q:q.q,options:q.options,answer:q.answer,why:q.why,src:"exam:"+pid,pick:pk}); // skipped questions go to review, not the mistake journal
      }
    });
    const T=window.GPM?GPM.threshold(pid):80; const pct=Math.round(correct/tot*100), passed=pct>=T;
    if(window.GPM) GPM.onExam(pid,results,pct);
    el("examres").innerHTML=`<div class="big" style="color:${passed?'var(--ok)':'var(--amber)'}">${pct}%</div>
      <p class="muted">${correct}/${tot} correct. ${passed?'Exam step passed. Next: a lab with evidence, your explanation and a troubleshooting variation — then the domains that depend on this one unlock.':'Below '+T+'%. Missed questions are now in your review queue; retake when ready.'}</p><div class="row" style="justify-content:center"><button class="btn sm" onclick="GP.go('${pid}')">Back to the mastery gate</button><button class="btn ghost sm" onclick="GP.retakeExam('${pid}')">Retake (fresh attempt)</button></div>`;

    save(); renderHUD();

  function rate(q){
    const D=GP._deck, c=D.queue[D.i];
    const isNew=!S.srs[c.id]; const s=S.srs[c.id]||{ef:2.5,interval:0,reps:0};
    if(isNew){ const t=dayKey(); S.newCards=(S.newCards&&S.newCards.d===t)?{d:t,n:(Number(S.newCards.n)||0)+1}:{d:t,n:1}; }
    if(q===0){ s.reps=0; s.interval=0; }
    else { s.ef=Math.max(1.3, s.ef + (0.1 - (3-q)*(0.08+(3-q)*0.02)));

  function simCode(){

    window._runKata=()=>{
      const K=KATAS[ki]; const src=el("codein").value; const out=[]; let pass=0;
      if(src.length>20000){el("codeout").textContent="Code is too long (20,000 character limit). Shorten it and try again.";return;}

      // Student-authored code must never execute in the app's main window: it could

const sendResult=self.postMessage.bind(self);

 self.postMessage=()=>{}; self.fetch=undefined; self.XMLHttpRequest=undefined; self.WebSocket=undefined; self.EventSource=undefined; self.WebSocketStream=undefined; self.WebTransport=undefined; self.importScripts=()=>{throw new Error('network imports disabled')};
 const src=data.src, tests=data.tests, logs=[];

 let pass=0; const out=[];
 for(const [expr,want] of tests){try{const fn=new Function('console','postMessage','close','importScripts','fetch','XMLHttpRequest','WebSocket','indexedDB','caches',src+'\\nreturn ('+expr+');');const got=fn(fakeConsole,undefined,undefined,undefined,undefined,undefined,undefined,undefined,undefined);const ok=JSON.stringify(got)===JSON.stringify(want);if(ok)pass++;out.push((ok?'✓ ':'✗ ')+expr+' → '+JSON.stringify(got)+(ok?'':'   (expected '+JSON.stringify(want)+')'));}catch(e){out.push('✗ '+expr+' → ERROR: '+(e&&e.message));}}

      const cleanup=()=>{worker.terminate();URL.revokeObjectURL(blobUrl);};
      const timer=setTimeout(()=>{if(finished)return;finished=true;cleanup();el("codeout").textContent="Timed out after 1 second. Infinite or excessively slow loops are stopped; simplify the algorithm and try again.";},1000);
      worker.onmessage=(event)=>{

    function solve(a,b,c,d,pfx){

      const toIp=n=>[(n>>>24)&255,(n>>16)&255,(n>>8)&255,n&255].join('.');
      return {ip:`${a}.${b}.${c}.${d}/${pfx}`,net:toIp(net),bc:toIp(bc),

        'readme.md':{type:'f',content:'# Genius Protocol\nYou are learning Linux. Nice.'},

    }};
    let cwd=['home','tyler']; const hist=[]; let hi=0;
    function node(path){ let n=fs; for(const p of path){ if(!n.children||!n.children[p])return null; n=n.children[p]; } return n; }
    function resolve(arg){
      let parts = arg.startsWith('/')?arg.split('/').filter(Boolean):cwd.concat(arg.split('/').filter(Boolean));
      const out=[]; for(const p of parts){ if(p==='.')continue; if(p==='..'){out.pop();continue;} out.push(p);} return out;
    }
    let outbuf="Genius Protocol shell · type 'help'\n";
    function run(cmd){
      const [c,...a]=cmd.trim().split(/\s+/); let o='';
      const cur=node(cwd);
      switch(c){
        case '': break;
        case 'help': o="commands: pwd ls [-l/-a] cd cat mkdir touch rm [-r] echo chmod grep whoami clear help"; break;
        case 'pwd': o='/'+cwd.join('/'); break;
        case 'whoami': o='tyler'; break;
        case 'clear': outbuf=''; render(); return;
        case 'ls':{ const flags=a.filter(x=>x.startsWith('-')).join(''); const tgt=a.find(x=>!x.startsWith('-'));
          const n=tgt?node(resolve(tgt)):cur; if(!n){o='ls: no such path';break;}
          if(n.type==='f'){o=tgt;break;}
          let names=Object.keys(n.children); if(!flags.includes('a')) names=names.filter(x=>!x.startsWith('.'));
          if(flags.includes('l')) o=names.map(nm=>{const ch=n.children[nm];return (ch.type==='d'?'drwxr-xr-x':'-rw-r--r--')+'  tyler  '+nm;}).join('\n');
          else o=names.join('  '); break; }
        case 'cd':{ const t=a[0]||'~'; if(t==='~'){cwd=['home','tyler'];break;} const r=resolve(t); const n=node(r);
          if(!n){o='cd: '+t+': no such directory';} else if(n.type!=='d'){o='cd: not a directory';} else cwd=r; break; }
        case 'cat':{ if(!a[0]){o='cat: missing file';break;} const n=node(resolve(a[0])); if(!n){o='cat: '+a[0]+': no such file';} else if(n.type!=='f'){o='cat: is a directory';} else o=n.content; break; }
        case 'echo': o=a.join(' ').replace(/^"|"$/g,''); break;
        case 'mkdir':{ if(!a[0]){o='mkdir: missing name';break;} const r=resolve(a[0]); const nm=r.pop(); const par=node(r)||cur; if(par&&par.children){par.children[nm]={type:'d',children:{}};} break; }
        case 'touch':{ if(!a[0]){o='touch: missing name';break;} const r=resolve(a[0]); const nm=r.pop(); const par=node(r)||cur; if(par&&par.children){par.children[nm]=par.children[nm]||{type:'f',content:''};} break; }

        case 'chmod': o=a.length>=2?'(mode of '+a[1]+' set to '+a[0]+')':'chmod: usage chmod MODE FILE'; break;
        case 'grep':{ if(a.length<2){o='grep: usage grep PATTERN FILE';break;} const n=node(resolve(a[1])); if(!n||n.type!=='f'){o='grep: '+a[1]+': no such file';break;} o=n.content.split('\n').filter(l=>l.includes(a[0])).join('\n')||'(no matches)'; break; }
        default: o=c+': command not found';

    S.tts=S.tts||{}; S.tts.voice=uri; save(); if(speaking){ const i=readIdx; stopRead(); startReading(i); } }
  function setRate(r){ S.tts=S.tts||{}; S.tts.rate=+r; save(); const v=el("ttsratev"); if(v) v.textContent=(+r).toFixed(2)+"×"; }
  function voiceHelp(){
    const h=el("ttshelp"); if(!h) return; h.style.display=h.style.display==='none'?'block':'none';
    const ua=navigator.userAgent; let tip;
    if(/iPhone|iPad/.test(ua)) tip="iPhone/iPad: <b>Siri's voices are system-only</b> — Apple doesn't let any app or website use them, so they never appear in this list. Two fixes: (1) Settings → Accessibility → Spoken Content → Voices → English → download <b>Ava (Premium)</b> or <b>Zoe (Premium)</b> (Apple's neural voices — nearly indistinguishable from Siri), then pick it in VOICE; if the list looks empty, press Play once and re-open the menu. (2) Tap <b>Reader Mode</b> and use iOS's own <b>Speak Screen</b> (two-finger swipe down from the top of the screen) — it reads in whatever voice you chose under Spoken Content, and on recent iOS that can be a Siri voice. Turn Speak Screen on under Accessibility → Spoken Content. If you're inside the Claude app, open the app in Safari (or from your Home Screen icon) for the full voice list.";
    else if(/Android/.test(ua)) tip="Android: Settings → System → Languages → Text-to-speech → Google Speech Services → Install voice data → English (US) → pick a high-quality voice. Then choose it in VOICE above. Or tap <b>Reader Mode</b> and use Android's <b>Select to Speak</b> (Accessibility) to read the page in your system voice.";
    else if(/Windows/.test(ua)) tip="Windows: open this app in <b>Microsoft Edge</b> — it ships neural voices (Aria, Jenny, Guy… marked ★ <i>Natural</i>) that sound like a real person. Chrome's built-in Windows voices are the robotic ones.";
    else if(/Mac/.test(ua)) tip="Mac: System Settings → Accessibility → Spoken Content → System Voice → Manage Voices → download a <b>Premium</b>/<b>Enhanced</b> English voice (Ava, Zoe, Evan). Then pick it in VOICE above.";
    else tip="Install a high-quality system voice in your OS's accessibility/text-to-speech settings, then pick it in VOICE above. Starred voices are the natural ones.";
    h.innerHTML="The voice comes from your device, not the app, so the fix is one setting. "+tip+" <span class='faint'>Voices marked ★ are neural/premium quality; the app auto-selects the best one it can find.</span>";
  }
  function speechText(node){
    const c=node.cloneNode(true);
    c.querySelectorAll('sup').forEach(s=>s.replaceWith(' to the power of '+s.textContent+' '));
    c.querySelectorAll('sub').forEach(s=>s.replaceWith(' '+s.textContent+' '));
    c.querySelectorAll('code').forEach(cd=>cd.replaceWith(' '+cd.textContent+' '));
    return c.textContent;
  }
  function lectureBlocks(){
    const blocks=[]; const add=(el2,text,pauseBefore)=>{ text=(text||'').replace(/\s+/g,' ').trim(); if(text) blocks.push({el:el2,text,pause:pauseBefore||0}); };
    const walk=(root)=>{ if(!root) return; root.querySelectorAll(':scope > *').forEach(n=>{
      const tag=n.tagName.toLowerCase();
      if(tag==='h4') add(n,speechText(n)+'.',900);
      else if(tag==='p') add(n,speechText(n),350);
      else if(tag==='ul'||tag==='ol'){ n.querySelectorAll(':scope > li').forEach((li,i)=>add(li,(tag==='ol'?`Step ${i+1}. `:'')+speechText(li),250)); }
      else if(tag==='pre') add(n,'Here is a short code example — read it on screen; I will continue.',400);
      else if(tag==='table'){ const rows=[...n.querySelectorAll('tr')]; if(rows.length){ add(n,'There is a table here. The key rows are:',500);
          rows.slice(0,8).forEach(tr=>{ const cells=[...tr.querySelectorAll('th,td')].map(c=>c.textContent.trim()).filter(Boolean); if(cells.length) add(tr,cells.join(', ')+'.',200); }); if(rows.length>8) add(n,'and more rows on screen.',200); } }
      else if(tag==='div'||tag==='section') walk(n);
      else add(n,speechText(n),300); }); };
    const sb=document.querySelector('.simplebox'); if(sb){ blocks.push({el:sb,text:'First, the simple version.',pause:0}); sb.querySelectorAll('p:not(.eyebrow)').forEach(p=>add(p,speechText(p),350)); blocks.push({el:sb,text:'Now the full lecture.',pause:700}); }
    walk(el("lecture"));
    const ex=el("lecture-ex"); if(ex){ blocks.push({el:ex,text:"Now, a worked example.",pause:900}); walk(ex); }
    return blocks;
  }
  function cleanForSpeech(t){
    return t.replace(/&mdash;|—/g,', ')
      .replace(/\bGB\/s\b/g,'gigabytes per second').replace(/\bMB\/s\b/g,'megabytes per second').replace(/\bTB\/s\b/g,'terabytes per second').replace(/\bKB\/s\b/g,'kilobytes per second')
      .replace(/\bGb\/s\b/g,'gigabits per second').replace(/\bMb\/s\b/g,'megabits per second').replace(/\bkm\/s\b/g,'kilometers per second').replace(/\bMT\/s\b/g,'megatransfers per second')
      .replace(/\bGiB\b/g,'gibibytes').replace(/\bKiB\b/g,'kibibytes').replace(/\bMiB\b/g,'mebibytes').replace(/\bTiB\b/g,'tebibytes')
      .replace(/\bns\b/g,'nanoseconds').replace(/\bµs\b/g,'microseconds').replace(/\bms\b/g,'milliseconds').replace(/\bRTT\b/g,'round-trip time')
      .replace(/\b(TCP|UDP)\/IP\b/g,'$1 I P').replace(/\bI\/O\b/g,'I O').replace(/\s*\/\s*/g,' or ')
      .replace(/0x([0-9A-Fa-f]+)/g,'hex $1').replace(/\^/g,' to the power of ').replace(/≈|~/g,'about ').replace(/→/g,' to ').replace(/·/g,', ');
  }
  // iPhone and iPad only let a page speak if the first utterance starts inside the tap itself.
  // Call this synchronously from a click handler, before any await or timer.
  function unlockSpeech(){ const pv=!!(window.GP_VOICE&&GP_VOICE.unlock()); if(!('speechSynthesis' in window)) return pv; if(pv) return true; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); if(speechSynthesis.paused) speechSynthesis.resume(); return true; }catch(e){ return false; } }
  function readAloud(){
    if(!('speechSynthesis'in window)&&!(window.GP_VOICE&&GP_VOICE.on())){ el("ttsnote").textContent="(this browser can't read aloud)"; return; }
    unlockSpeech();
    if(speaking&&paused){ pauseRead(); return; }
    stopRead(); readQueue=lectureBlocks(); if(!readQueue.length) return;
    fillVoiceSelect(); startReading(0);
  }
  let readRun=0;
  function startReading(from){
    readRun++; speaking=true; paused=false; readIdx=from; const pb=el("ttspause"); if(pb) pb.textContent="❚❚ Pause";
    const pro=!!(window.GP_VOICE&&GP_VOICE.on());
    const v=bestVoice(); el("ttsnote").textContent="▶ "+(pro?GP_VOICE.label():(v?v.name.replace(/^Microsoft |^Google /,''):"default voice"));
    const speakNext=()=>{
      if(!speaking) return;
      if(curBlock){ curBlock.classList.remove('reading'); curBlock=null; }
      if(readIdx>=readQueue.length){ speaking=false; el("ttsnote").textContent="lecture complete ✓"; return; }
      const b=readQueue[readIdx];
      readTimer=setTimeout(()=>{ if(!speaking) return;
        curBlock=b.el; curBlock.classList.add('reading'); try{ curBlock.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){}
        if(pro){ const nb=readQueue[readIdx+1]; const myRun=readRun;
          GP_VOICE.say(cleanForSpeech(b.text),{title:(document.querySelector('#deck h1')||{}).textContent||'Lecture',prefetchNext:nb?cleanForSpeech(nb.text):''})
            .then(()=>{ if(!speaking||myRun!==readRun) return; readIdx++; speakNext(); })
            .catch(e=>{ if(!speaking||myRun!==readRun) return; GP_VOICE.suspend(); toast(GP_VOICE.explain(e)+' Switching to the device voice.'); startReading(readIdx); });
          return; }
        const u=new SpeechSynthesisUtterance(cleanForSpeech(b.text)); const vv=bestVoice(); if(vv) u.voice=vv; u.lang=(vv&&vv.lang)||'en-US';
        u.rate=(S.tts&&S.tts.rate)||0.95; u.pitch=1.0; u.volume=1;
        u.onend=()=>{ readIdx++; speakNext(); }; u.onerror=(e)=>{ if(e&&e.error==='interrupted') return; readIdx++; speakNext(); };
        speechSynthesis.speak(u); }, readIdx===from?0:b.pause);
    };
    speakNext();
  }
  // Reader Mode: a clean, chrome-free text view so the phone's own screen reader (iOS Speak Screen with any
  // Spoken Content voice, including Siri on recent iOS; Android Select to Speak) can read the lecture in order.
  function readerMode(){
    stopRead();
    const blocks=lectureBlocks(); if(!blocks.length) return;
    const h1=document.querySelector('#view h1'); const title=h1?h1.textContent:'Lecture';
    const isIOS=/iPhone|iPad/.test(navigator.userAgent), isAndroid=/Android/.test(navigator.userAgent);
    let html=`<h1>${esc(title)}</h1>`;
    blocks.forEach(b=>{ const tag=b.el.tagName.toLowerCase();
      if(tag==='h4') html+=`<h2>${esc(b.text.replace(/\.$/,''))}</h2>`;
      else if(/code example/.test(b.text)||/There is a table here/.test(b.text)||/more rows on screen/.test(b.text)) return;
      else html+=`<p>${esc(cleanForSpeech(b.text))}</p>`; });
    el('rbody').innerHTML=html; el('rbody').scrollTop=0;
    const hint=isIOS?'iOS: swipe <b>down with two fingers from the top of the screen</b> to start Speak Screen (turn it on under Settings → Accessibility → Spoken Content). It reads in your Spoken Content voice — Siri voices included on recent iOS.'
      :isAndroid?'Android: use <b>Select to Speak</b> (Accessibility) and tap the text, or the accessibility button, to read in your system voice.'
      :'Use your system screen reader / Speak Selection on this page, or go back and press Play.';
    el('rbar').innerHTML=`<button class="btn sm" onclick="GP.closeReader()">✕ Exit Reader</button><span style="flex:1;min-width:200px">${hint}</span>`;
    el('reader').classList.add('show'); document.body.style.overflow='hidden';
  }
  function closeReader(){ el('reader').classList.remove('show'); document.body.style.overflow=''; }
  function pauseRead(){
    if(!speaking) return; const pb=el("ttspause");
    if(window.GP_VOICE&&GP_VOICE.on()){ if(!paused){ paused=true; GP_VOICE.pause(); if(pb) pb.textContent="▶ Resume"; el("ttsnote").textContent="paused"; } else { paused=false; GP_VOICE.resume(); if(pb) pb.textContent="❚❚ Pause"; el("ttsnote").textContent="▶ playing"; } return; }
    if(!paused){ paused=true; try{ speechSynthesis.pause(); }catch(e){} if(pb) pb.textContent="▶ Resume"; el("ttsnote").textContent="paused"; }
    else { paused=false; try{ speechSynthesis.resume(); }catch(e){} if(pb) pb.textContent="❚❚ Pause"; el("ttsnote").textContent="▶ playing"; }
  }
  function stopRead(){ speaking=false; paused=false; clearTimeout(readTimer); if(window.GP_VOICE) GP_VOICE.stop(); if('speechSynthesis'in window){ try{ speechSynthesis.cancel(); }catch(e){} }
    if(curBlock){ curBlock.classList.remove('reading'); curBlock=null; } document.querySelectorAll('.reading').forEach(x=>x.classList.remove('reading'));
    const n=el("ttsnote"); if(n)n.textContent=""; const pb=el("ttspause"); if(pb) pb.textContent="❚❚ Pause"; }

  // ---------- boot ----------
  const API={ get S(){return S;}, save, addXP, toast, set, esc, el, phases, phase, allModules, allCards, dueCards, moduleDone, phaseUnlocked, phaseProgress, renderHUD, popin, logMiss, shuffle, deriveTerms, CERTS, LISTEN, GLOSSARY, SIMS, QUOTES, XP, certFor, certAge, ageWords, certReviewOpen, dayKey, unlockSpeech, normalizeState, nextUp, level,
    getSample, ADA_SYS, bestVoice, cleanForSpeech, stopRead, voiceList, fillVoiceSelect, completeModule, moduleView };
  window.GP_API=API;
  function boot(){
    renderHUD();
    if(S.readpx) document.documentElement.style.setProperty('--read',S.readpx+'px');
    document.addEventListener('click',e=>{ if(!e.target.closest('.kw')) hideKw(); });
    window.addEventListener('hashchange',()=>{ GP._lastModule = /m\d+$/.test((location.hash||'').slice(1))?(location.hash||'').slice(1):GP._lastModule; onHash(); stopRead(); closeReader(); clearTimeout(GP._popTimer); closePop(); });
    onHash();
    if(window.__GP_STORAGE_WARNING && !storageWarned){storageWarned=true;setTimeout(()=>toast(window.__GP_STORAGE_WARNING),250);}
  }

  return {go,boot,jump,completeModule,pick,saGrade,gradeExam,retakeExam,flip,rate,doneLab,certPick,markListen,
    quick,send,teachBack,readAloud,stopRead,pauseRead,setVoice,setRate,voiceHelp,readerMode,closeReader,explainSimpler,textSize,closePop,vocabPick,_deck:null,_exam:null,_cert:null,_lastModule:null,
